[package]
name = "vyges-meas"
version = "0.1.33"
edition = "2021"
description = "Closed measurement kernels: coherent single-tone spectral metrics (SNR/SINAD/THD/SFDR) and AC transfer metrics (gain, bandwidth, unity frequency, phase margin)."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/meas"

# No third-party deps — the DFT and the metric arithmetic are std-only, so a result
# depends on nothing that could change underneath it between releases.
[dependencies]
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

[[bin]]
name = "vyges-meas"
path = "src/main.rs"

[lib]
name = "vyges_meas"
path = "src/lib.rs"
